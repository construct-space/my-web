# Headers written onto every proxied upstream request.
# Identity headers are only populated by auth_request — the direct /api/auth/*
# paths (unauthenticated) will still include them as empty strings, which
# downstream handlers must treat as absent.

## Host header is intentionally NOT set here — every location must set it
## explicitly (Host $host for same-VPS upstreams, Host <fqdn> for foreign
## upstreams that route by Host). Setting it in the snippet AND overriding
## in the location is "undefined behavior" per nginx docs and observably
## causes the override to be ignored.
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Request-ID       $request_id_out;
proxy_set_header X-Internal-Secret  ${INTERNAL_SHARED_SECRET};

proxy_set_header X-Auth-User-ID      $auth_user_id;
proxy_set_header X-Auth-User-Row-ID  $auth_user_row_id;
proxy_set_header X-Auth-User-Email   $auth_user_email;
proxy_set_header X-Auth-User-Name    $auth_user_name;
proxy_set_header X-Auth-Org-ID       $auth_org_id;
proxy_set_header X-Auth-Roles        $auth_roles;
proxy_set_header X-Auth-Publisher-ID $auth_publisher_id;
proxy_set_header X-Auth-Scope        $auth_scope;

# Preserve original Authorization (services keep a direct-validation fallback
# for dev / curl — see PRD §8 middleware example).
proxy_set_header Authorization       $http_authorization;
proxy_set_header X-API-Key           $http_x_api_key;

proxy_http_version 1.1;
proxy_set_header Connection "";
