# auth_request subrequest publishes identity on X-Auth-* response headers;
# this snippet captures them as variables so proxy_set_header can forward
# them to the upstream service.

auth_request_set $auth_user_id        $upstream_http_x_auth_user_id;
auth_request_set $auth_user_row_id    $upstream_http_x_auth_user_row_id;
auth_request_set $auth_user_email     $upstream_http_x_auth_user_email;
auth_request_set $auth_user_name      $upstream_http_x_auth_user_name;
auth_request_set $auth_org_id         $upstream_http_x_auth_org_id;
auth_request_set $auth_roles          $upstream_http_x_auth_roles;
auth_request_set $auth_publisher_id   $upstream_http_x_auth_publisher_id;
auth_request_set $auth_scope          $upstream_http_x_auth_scope;
