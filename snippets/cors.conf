# CORS + OPTIONS preflight handling — included at the top of every /api/
# location BEFORE auth_request. Purpose:
#
# 1. OPTIONS preflight: browsers send these before any cross-origin
#    request that carries Authorization/X-API-Key or a non-simple
#    Content-Type. They MUST be unauthenticated (no bearer token is sent
#    on a preflight) — so if auth_request runs, preflight fails with 401
#    and the actual request is never made. Short-circuit to 204.
#
# 2. Actual requests: attach Access-Control-Allow-Origin so browsers
#    release the response body to the app. Origin is echoed back only if
#    it matches the allowlist in $cors_origin (map defined up top).

if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin       $cors_origin      always;
    add_header Access-Control-Allow-Credentials  'true'            always;
    add_header Access-Control-Allow-Methods      'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers      'Content-Type, Authorization, X-API-Key, X-Api-Key, X-CSRF-Token, X-Request-ID, X-Space-ID, X-Project-ID, X-Company-ID' always;
    add_header Access-Control-Max-Age            86400             always;
    add_header X-Content-Type-Options            'nosniff'         always;
    add_header X-Frame-Options                   'DENY'            always;
    add_header Referrer-Policy                   'strict-origin-when-cross-origin' always;
    add_header Content-Length                    0                 always;
    add_header Content-Type                      'text/plain'      always;
    return 204;
}

# Strip any CORS headers the upstream might have emitted (accounts'
# middleware sets its own Access-Control-Allow-Origin when a matching
# Origin is on its ALLOWED_ORIGINS list). If we don't hide them, both
# accounts' and our headers arrive on the same response and the browser
# errors with "Access-Control-Allow-Origin cannot contain more than one
# origin." CORS policy lives at the gateway, not in every service.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;

# Allow-origin on the real response (always, so even error responses
# carry the header — otherwise browsers report "CORS error" instead of
# showing the actual 4xx/5xx body).
add_header Access-Control-Allow-Origin       $cors_origin always;
add_header Access-Control-Allow-Credentials  'true'       always;
add_header X-Content-Type-Options            'nosniff'    always;
add_header X-Frame-Options                   'DENY'       always;
add_header Referrer-Policy                   'strict-origin-when-cross-origin' always;
